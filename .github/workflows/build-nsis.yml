name: Build NSIS Setup EXE (Offline-ready)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for selftest
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run selftest (syntax + tools)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install numpy requests pypdf Pillow --quiet
          $env:PYTHONPATH = Join-Path $pwd "scripts\python"
          python scripts\python\selftest.py
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }

      - name: Download llama-server (Windows x64 CPU)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path bin, bin\_tmp | Out-Null
          
          # استفاده از لینک مستقیم به نسخه پایدار b8581
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/b8581/llama-b8581-bin-win-cpu-x64.zip"
          
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "bin\_tmp\llama.zip" -UseBasicParsing
          Expand-Archive -Path "bin\_tmp\llama.zip" -DestinationPath "bin\_tmp\out" -Force
          
          $exe = Get-ChildItem -Path "bin\_tmp\out" -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe not found inside archive" }
          
          Copy-Item -Force $exe.FullName "bin\llama-server.exe"
          Get-ChildItem -Path $exe.Directory.FullName -Filter "*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Force -Destination "bin\"
          Remove-Item -Recurse -Force "bin\_tmp"
          
          if (-not (Test-Path "bin\llama-server.exe")) { throw "bin\llama-server.exe missing after copy" }
          $len = (Get-Item "bin\llama-server.exe").Length
          Write-Host "OK llama-server.exe ($len bytes)"
          
          # Fail if the downloaded file is suspiciously small (corrupted download)
          if ($len -lt 1000000) { throw "FATAL: llama-server.exe is too small ($len bytes). Download likely corrupted." }

      - name: Build offline embedded Python (amd64) + packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = "installer\payload"
          $offline = "installer\payload\python-offline-amd64"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          if (Test-Path $offline) { Remove-Item -Recurse -Force $offline }
          New-Item -ItemType Directory -Force -Path $offline | Out-Null

          $ver = "3.11.9"
          $zipName = "python-$ver-embed-amd64.zip"
          $zipPath = Join-Path $payload $zipName
          $url = "https://www.python.org/ftp/python/$ver/$zipName"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile (Join-Path $payload "get-pip.py") -UseBasicParsing

          Expand-Archive -Path $zipPath -DestinationPath $offline -Force

          $pth = Get-ChildItem $offline -Filter "python*._pth" | Select-Object -First 1
          if (-not $pth) { throw "python*._pth not found in embed package" }
          $lines = @(Get-Content $pth.FullName)
          $new = @()
          $sawSite = $false
          foreach ($line in $lines) {
            if ($line -match '^\s*#\s*import site') {
              $new += 'import site'
              $sawSite = $true
            } elseif ($line -match '^\s*import site') {
              $new += 'import site'
              $sawSite = $true
            } else {
              $new += $line
            }
          }
          if (-not $sawSite) { $new += 'import site' }
          if (-not ($new -match 'site-packages')) { $new += 'Lib\site-packages' }
          Set-Content -Path $pth.FullName -Value $new -Encoding ASCII
          Write-Host "Patched $($pth.Name)"

          $py = Join-Path $offline "python.exe"
          if (-not (Test-Path $py)) { throw "python.exe missing in embed tree" }

          & $py (Join-Path $payload "get-pip.py") --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "get-pip failed" }
          & $py -m pip install --upgrade pip wheel setuptools --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }

          $required = @("customtkinter", "requests", "pypdf", "Pillow", "numpy")
          foreach ($pkg in $required) {
            Write-Host "pip install $pkg"
            & $py -m pip install $pkg --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw "pip install failed: $pkg" }
          }

          Write-Host "=== Installing llama-cpp-python (CPU) ==="
          $env:CMAKE_ARGS = "-DGGML_NATIVE=OFF"
          
          & $py -m pip install scikit-build-core --no-warn-script-location
          
          & $py -m pip install "llama-cpp-python>=0.2.90" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --no-warn-script-location --no-cache-dir
          
          & $py -c "import llama_cpp; print('import ok', getattr(llama_cpp, '__version__', '?'))"
          if ($LASTEXITCODE -ne 0) {
            throw "FATAL: llama-cpp-python could not be installed/imported. Refusing to ship broken offline installer."
          }
          Write-Host "llama-cpp-python OK"

          Write-Host "=== Verify imports ==="
          $checks = @(
            "import sys; print(sys.version)",
            "import customtkinter; print('customtkinter OK')",
            "import llama_cpp; print('llama_cpp OK')",
            "import requests; print('requests OK')",
            "import pypdf; print('pypdf OK')",
            "from PIL import Image; print('Pillow OK')",
            "import numpy; print('numpy OK')"
          )
          foreach ($code in $checks) {
            & $py -c $code
            if ($LASTEXITCODE -ne 0) { throw "Import verification failed: $code" }
          }

          $root = (Resolve-Path ".").Path
          $env:PYTHONPATH = Join-Path $root "scripts\python"
          & $py -c "import config_loader, agent_tools, osint_tools; print('project modules OK', len(agent_tools.TOOLS), 'tools')"
          if ($LASTEXITCODE -ne 0) { throw "Project module import failed" }

          $marker = @"
          {
            "built_at": "$(Get-Date -Format o)",
            "python": "$ver",
            "llama_cpp": true,
            "customtkinter": true,
            "llama_server_bundled": true,
            "app_version": "2.4.0"
          }
          "@
          Set-Content -Path (Join-Path $offline "gguf_runner_offline.json") -Value $marker -Encoding UTF8

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis not found after choco install" }
          echo "MAKENSIS=$makensis" >> $env:GITHUB_ENV
          Write-Host "Using $makensis"

      - name: Compile NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "bin\llama-server.exe")) { throw "bin\llama-server.exe required before NSIS compile" }
          if (-not (Test-Path "installer\payload\python-offline-amd64\python.exe")) {
            throw "offline python missing before NSIS compile"
          }
          New-Item -ItemType Directory -Force -Path installer\Output | Out-Null
          Set-Location installer
          & "$env:MAKENSIS" /V2 GGUF-Runner.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with code $LASTEXITCODE" }
          $setup = Get-ChildItem Output\GGUF-Runner-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup EXE not produced" }
          Write-Host "Built $($setup.Name) size=$($setup.Length)"

      - uses: actions/upload-artifact@v4
        with:
          name: GGUF-Runner-NSIS-Setup
          path: installer/Output/GGUF-Runner-Setup-*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/GGUF-Runner-Setup-*.exe
          generate_release_notes: true
          body: |
            ## GGUF Runner offline Setup (v2.9)
            This installer embeds Python 3.11, llama-cpp-python, customtkinter, and llama-server.exe.
            After install you only need to add `.gguf` model files into the `models` folder.
            Team: Mehdi Tariri · Mohsen Tarifii
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
